name: CI

on:
  workflow_dispatch:
    inputs:
      run_bench_integration:
        description: "Run full Frappe v16 + MariaDB 11.8 bench integration suite"
        required: false
        default: false
        type: boolean
      test_module:
        description: "Optional specific Python module to test in bench run-tests"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  fast-tdd-unit:
    name: Fast TDD Unit & Linter Suite (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install package and dev dependencies
        run: |
          uv venv --python 3.14
          uv pip install -e ".[dev]"

      - name: Run Ruff linter and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest unit & XAdES-BES cryptographic signing suite
        run: |
          uv run pytest -v --cov=l10n_ec/sri --cov-report=term-missing

  frappe-v16-integration:
    name: Frappe v16 + MariaDB 11.8 Integration Suite
    if: ${{ inputs.run_bench_integration }}
    needs: fast-tdd-unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: "production"
    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: "root"
        ports:
          - 3306:3306
        options: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev redis-tools
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Initialize Frappe v16 Bench and install l10n_ec
        run: |
          pip install frappe-bench
          bench init --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app erpnext --branch version-16 --resolve-deps
          bench get-app l10n_ec "${GITHUB_WORKSPACE}" --resolve-deps
          bench new-site test_site \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test_site install-app erpnext
          bench --site test_site install-app l10n_ec
          bench --site test_site set-config allow_tests true

      - name: Run Frappe v16 Integration Tests
        run: |
          cd ~/frappe-bench
          if [ -n "${{ inputs.test_module }}" ]; then
            bench --site test_site run-tests --app l10n_ec --module "${{ inputs.test_module }}"
          else
            bench --site test_site run-tests --app l10n_ec
          fi
